<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>취쥐직 · 로컬 API 연결</title><style>body{background:#f7f3fd;color:#28174a;font:15px system-ui,sans-serif;margin:0;padding:40px 20px}main{max-width:480px;margin:30px auto;background:white;border:1px solid #e7dbf7;border-radius:20px;padding:30px}h1{font-size:24px;margin-top:0}p{line-height:1.9;color:#8c7a9f;font-size:13px}label{display:block;margin:24px 0 8px;font-weight:700}input,button{box-sizing:border-box;width:100%;padding:14px;font:inherit;border-radius:10px;border:1px solid #ddd0ee}button{background:#8148dc;color:white;border:0;margin:14px 0;cursor:pointer}button:disabled{opacity:.5}a{color:#8148dc}#status{white-space:pre-wrap}small{font-size:11px;color:#9a88a9}</style></head><body><main><h1>취쥐직 · API 연결 설정</h1><p>이 PC의 주소 검색·채용·DART 조회와 선택적 AI 요약을 설정합니다. 서비스별 본인의 API 키를 입력하세요. 키는 로컬 .env에 저장되며 GitHub에 올라가지 않습니다.</p><p><a href="https://developers.kakao.com/console/app" target="_blank" rel="noopener noreferrer">카카오디벨로퍼스에서 REST API 키 확인 ↗</a></p><form id="setup-form"><label for="provider">연결 서비스</label><select id="provider" style="width:100%;padding:12px;margin-bottom:12px"><option value="kakao">카카오 로컬 · REST API 키</option><option value="work24">고용24 · API 인증키</option><option value="dart">OpenDART · API 인증키</option><option value="openai">OpenAI · 공식자료 AI 요약 (선택·별도 과금)</option></select><label for="kakao-key">API 키</label><input id="kakao-key" type="password" autocomplete="off" spellcheck="false" placeholder="선택한 서비스의 API 키" required><small>주소 검색에는 카카오 REST API 키가 필요합니다. AI 요약에만 OpenAI 키를 사용하며 사용량이 과금됩니다.</small><button id="submit" type="submit">연결 확인 후 저장</button></form><p id="status" role="status"></p><a href="/">사이트로 돌아가기 →</a></main><script>const token='__SETUP_TOKEN__';document.querySelector('#setup-form').onsubmit=async e=>{e.preventDefault();const b=document.querySelector('#submit'),s=document.querySelector('#status'),field=document.querySelector('#kakao-key');b.disabled=true;s.textContent='API 연결 확인 중…';try{const r=await fetch('/setup',{method:'POST',credentials:'same-origin',headers:{'Content-Type':'application/json'},body:JSON.stringify({token,provider:document.querySelector('#provider').value,apiKey:field.value})});field.value='';const d=await r.json();if(!r.ok)throw new Error(d.error||'저장하지 못했습니다.');s.textContent='연결을 확인하고 저장했습니다. 서버 재시작 없이 선택한 서비스를 사용할 수 있습니다.'}catch(error){s.textContent=error.message||'연결에 실패했습니다.'}finally{field.value='';b.disabled=false}};</script></body></html>
